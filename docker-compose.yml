services:
  postgres:
    image: postgres:16
    container_name: finance-control-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: finance_control
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - finance_control_pgdata:/var/lib/postgresql/data

volumes:
  finance_control_pgdata: