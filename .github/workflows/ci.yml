name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    name: Lint, tests and build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: finance_control_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d finance_control_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/finance_control_test?schema=public
      JWT_SECRET: github-actions-test-secret
      JWT_EXPIRES_IN: 7d
      NEXT_PUBLIC_APP_URL: http://localhost:3000

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Create test env file
        run: |
          cat > .env.test <<'EOF'
          DATABASE_URL="postgresql://postgres:postgres@localhost:5432/finance_control_test?schema=public"
          JWT_SECRET="github-actions-test-secret"
          JWT_EXPIRES_IN="7d"
          EOF

      - name: Apply test database migrations
        run: npx prisma migrate deploy

      - name: Lint
        run: npm run lint

      - name: Run all tests
        run: npm run test:all

      - name: Build
        run: npm run build
